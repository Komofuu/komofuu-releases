name: Ask for help
description: Installation, setup or general usage questions.
title: "[Help]: "
body:
  - type: input
    id: version
    attributes:
      label: Komofuu version and Windows version
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      description: Tell us what you tried. Do not post credentials or private screen/clipboard contents.
    validations:
      required: true
